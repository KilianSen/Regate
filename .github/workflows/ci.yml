name: ci
on: [push, pull_request]

jobs:
  eggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e backends/eggregate
      - name: test suite
        run: python backends/eggregate/tests/test_eggregate.py
      - name: rule-library soundness gate
        run: cd backends/eggregate && python check_rules.py

  conformance:
    runs-on: ubuntu-latest
    needs: eggregate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e backends/eggregate
      # Install the two lightweight provers so conformance exercises the formal
      # backends' *certified* induction paths (fixtures 23/25) rather than skipping
      # them: cvc5 is a ~60 MB wheel, coq is an apt package (~1 min). leanregate
      # stays skipped here — its Mathlib olean closure is ~9 GB, impractical for a
      # per-PR job — and is covered by the dedicated `leanregate` job below via
      # check_induction.py. The runner's `requires:` gate skips, never fails, when a
      # tool is absent, so this job still passes if an install step is removed.
      - run: pip install cvc5
      - run: sudo apt-get update && sudo apt-get install -y coq
      - name: protocol conformance (target backends)
        run: python conformance/run_conformance.py

  leanregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: backends/leanregate
          build: false            # no Lean library to build — rules come from the API
      # Leanregate has no Basic.lean. Its formal guarantee is exercised live: fetch
      # Mathlib's oleans, then have the runtime prover emit + kernel-check the
      # induction proofs. A regressed prover/emitter fails CI here.
      - name: fetch Mathlib oleans
        working-directory: backends/leanregate
        run: lake exe cache get
      - name: emitted induction proofs kernel-check (live Lean)
        working-directory: backends/leanregate
        env:
          LEANREGATE_LEAN_PROJECT: ${{ github.workspace }}/backends/leanregate
        run: python check_induction.py --require-lean

  coqregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # `coq` from apt carries coqc + the stdlib (ring/field/lia) — no Mathlib.
      - name: install Coq
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends coq
      - name: coqregate unit tests
        run: python backends/coqregate/tests/test_coq_prover.py
      - name: emitted induction proofs kernel-check (live coqc)
        working-directory: backends/coqregate
        run: python check_induction.py --require-coq

  cvc5regate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      # Single static solver binary — no library to build.
      #
      # NOT `pip install cvc5`: that wheel ships the Python BINDINGS only. It has no
      # `bin/`, no `.data/scripts/` and no entry points, so it can never put a `cvc5`
      # executable on PATH — and `check_induction.py --require-cvc5` shells out to one,
      # so the job failed with "no cvc5 binary" however the wheel was installed.
      # Pinned: the induction gate's expected verdicts were recorded against 1.3.4.
      - name: install cvc5
        env:
          CVC5_VERSION: "1.3.4"
        run: |
          curl -sSL -o cvc5.zip \
            "https://github.com/cvc5/cvc5/releases/download/cvc5-${CVC5_VERSION}/cvc5-Linux-x86_64-static.zip"
          unzip -q cvc5.zip
          sudo install -m 755 "cvc5-Linux-x86_64-static/bin/cvc5" /usr/local/bin/cvc5
          rm -rf cvc5.zip "cvc5-Linux-x86_64-static"
          cvc5 --version
      - name: cvc5regate unit tests
        run: python backends/cvc5regate/tests/test_cvc5_prover.py
      - name: cvc5regate non-induction grading tests
        run: python backends/cvc5regate/tests/test_cvc5_equiv.py
      - name: cvc5regate declared-assumption tests
        run: python backends/cvc5regate/tests/test_cvc5_assumptions.py
      - name: emitted induction goals solved (live cvc5)
        working-directory: backends/cvc5regate
        run: python check_induction.py --require-cvc5
