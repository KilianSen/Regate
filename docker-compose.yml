# Run both grading backends together. Build context is the repo root so each
# image can vendor the canonical GRADING_PROTOCOL.md.
services:
  eggregate:
    build:
      context: .
      dockerfile: backends/eggregate/Dockerfile
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  leanregate:
    build:
      context: .
      dockerfile: backends/leanregate/Dockerfile
    ports: ["8001:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  coqregate:
    build:
      context: .
      dockerfile: backends/coqregate/Dockerfile
    ports: ["8002:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  cvc5regate:
    build:
      context: .
      dockerfile: backends/cvc5regate/Dockerfile
    ports: ["8003:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
