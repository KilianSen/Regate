[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eggregate"
version = "0.1.0"
description = "pluggable e-graph reasoning backend for grading equational reasoning in learning platforms"
requires-python = ">=3.11"
dependencies = ["egglog==13.2.0"]

[project.scripts]
eggregate-serve = "eggregate.server:run_http"

[tool.setuptools]
packages = ["eggregate"]
